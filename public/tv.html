<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>شاشة النداء | Bipilo</title>
<!--
  «شاشة النداء» for TVs. Old TV browsers (Samsung, LG, Android TV WebView…) cannot
  run the main site, so this page is plain ES5 + plain CSS, with no build step.
  It reads the called numbers from the same RPC as the main screen every 3 s,
  and says «الطلب رقم … جاهز» from the clips in /voice/ar.
  Keep it ES5: no let/const, arrow functions, template strings or modern APIs.
-->
<style>
  html, body { margin: 0; height: 100%; background: #101112; color: #f3f6f4; overflow: hidden;
    font-family: "Readex Pro", Tahoma, Arial, sans-serif; }
  #app { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 2.5vh 2.5vw;
    -webkit-box-sizing: border-box; box-sizing: border-box; display: -webkit-box; display: -webkit-flex;
    display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
  #head { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify;
    -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center;
    -webkit-align-items: center; align-items: center; margin-bottom: 2.5vh; }
  #who { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center;
    -webkit-align-items: center; align-items: center; }
  #logo, #initial { width: 7vh; height: 7vh; border-radius: 1.6vh; margin-left: 1.6vh; }
  #logo { background: #fff; }
  #initial { background: #0c3e38; color: #b9f2cf; font-weight: 700; font-size: 3.6vh; line-height: 7vh;
    text-align: center; display: inline-block; }
  #name { display: block; font-size: 3.4vh; font-weight: 700; }
  #sub { display: block; font-size: 2vh; color: #9aa59f; }
  #by { padding-top: 0.8vh; text-align: left; font-size: 1.9vh; line-height: 1; color: #9aa59f; letter-spacing: 0.04em; direction: ltr; }
  #by b { font-weight: 700; }
  #actions { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center;
    -webkit-align-items: center; align-items: center; }
  .tool { display: inline-block; margin-left: 1.4vh; padding: 1.2vh 2vh; border: 0.3vh solid #3a4a42; border-radius: 99vh;
    background: #1c2620; color: #f3f6f4; font-family: inherit; font-size: 2.3vh; font-weight: 700; cursor: pointer;
    white-space: nowrap; }
  .tool.on { background: #0c3e38; border-color: #7ee2a8; }
  .tool:focus { outline: 0.5vh solid #ffffff; }
  .ico { display: inline-block; width: 2.8vh; height: 2.8vh; vertical-align: middle; margin-left: 0.8vh; }
  .ico svg { width: 100%; height: 100%; display: block; }
  #clock { margin-right: 1vh; font-size: 4.2vh; font-weight: 700; color: #d6dcd8; direction: ltr; letter-spacing: 0.2vh; }
  #board { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; background: #17191b; border-radius: 2.4vh;
    padding: 2.6vh 2.6vw; display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; min-height: 0; }
  #label { margin: 0 0 2vh; font-size: 3.6vh; color: #7ee2a8; }
  #stage { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; display: -webkit-box; display: -webkit-flex;
    display: flex; min-height: 0; }
  #latest { -webkit-box-flex: 3; -webkit-flex: 3; flex: 3; background: #133a2b; border-radius: 2.4vh;
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical;
    -webkit-flex-direction: column; flex-direction: column; -webkit-box-align: center;
    -webkit-align-items: center; align-items: center; -webkit-box-pack: center;
    -webkit-justify-content: center; justify-content: center; margin-left: 2vw; padding: 2vh; }
  #latest small { font-size: 3vh; color: #cfeedd; margin-bottom: 3vh; font-weight: 700; }
  #latest.fresh { -webkit-animation: call 1s ease-in-out infinite; animation: call 1s ease-in-out infinite; }
  @-webkit-keyframes call { 50% { background: #1f6b3e; } }
  @keyframes call { 50% { background: #1f6b3e; } }
  #recent { -webkit-box-flex: 2; -webkit-flex: 2; flex: 2; list-style: none; margin: 0; padding: 0;
    display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap;
    -webkit-align-content: flex-start; align-content: flex-start; }
  #recent li { width: 46%; margin: 0 0 2vh 4%; padding: 2.2vh 0; background: #1c2c22; border-radius: 1.8vh;
    text-align: center; }
  #recent li.fresh { background: #1f6b3e; }
  #empty { margin: auto; font-size: 3.4vh; color: #9aa59f; text-align: center; }
  .num { display: inline-block; direction: ltr; white-space: nowrap; }
  .digit { display: inline-block; vertical-align: middle; }
  .row { display: block; white-space: nowrap; line-height: 0; }
  .dot { display: inline-block; border-radius: 50%; background: rgba(126, 226, 168, 0.12); }
  .dot.on { background: #8ff0b8; }
  #latest .dot.on { background: #ffffff; }
  .glyph { font-weight: 700; color: #ffffff; vertical-align: middle; }
  .boldnum { font-weight: 800; line-height: 1; letter-spacing: 0.04em; }
  #latestNum .num { display: inline-block; -webkit-animation: pulse 1.6s ease-in-out infinite; animation: pulse 1.6s ease-in-out infinite; }
  #recent li .num { display: inline-block; -webkit-animation: pulse-soft 2.4s ease-in-out infinite; animation: pulse-soft 2.4s ease-in-out infinite; }
  @-webkit-keyframes pulse { 0%, 100% { -webkit-transform: scale(1); opacity: 1; } 50% { -webkit-transform: scale(1.06); opacity: 0.86; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.86; } }
  @-webkit-keyframes pulse-soft { 0%, 100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.04); } }
  @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { #latestNum .num, #recent li .num { -webkit-animation: none; animation: none; } }
  #notice { position: absolute; bottom: 2vh; left: 2vw; right: 2vw; margin: 0; padding: 1.6vh; text-align: center;
    background: #5a2a1f; color: #ffd7cc; border-radius: 1.4vh; font-size: 2.4vh; }
  #unlock { position: absolute; top: 50%; left: 50%; width: 70vw; margin-left: -35vw; margin-top: -10vh;
    min-height: 20vh; padding: 3vh; border: 0.6vh solid #7ee2a8; border-radius: 3vh; background: #0c3e38;
    color: #ffffff; font-family: inherit; font-size: 4.2vh; font-weight: 700; cursor: pointer; }
  #unlock:focus { outline: 0.6vh solid #ffffff; }
  [hidden] { display: none !important; }
  /* French: the same spacing, mirrored. */
  html[dir="ltr"] #logo, html[dir="ltr"] #initial { margin-left: 0; margin-right: 1.6vh; }
  html[dir="ltr"] .tool { margin-left: 0; margin-right: 1.4vh; }
  html[dir="ltr"] .ico { margin-left: 0; margin-right: 0.8vh; }
  html[dir="ltr"] #clock { margin-right: 0; margin-left: 1vh; }
  html[dir="ltr"] #latest { margin-left: 0; margin-right: 2vw; }
  html[dir="ltr"] #recent li { margin: 0 4% 2vh 0; }
</style>
</head>
<body>
<div id="app">
  <header id="head">
    <div id="who">
      <img id="logo" alt="" hidden>
      <span id="initial">B</span>
      <div><b id="name">Bipilo</b><small id="sub">شاشة النداء</small></div>
    </div>
    <div id="actions">
      <button id="repeatBtn" type="button" class="tool"><span class="ico" id="repeatIco"></span><span id="repeatText">مرتين</span></button>
      <button id="soundBtn" type="button" class="tool"><span class="ico" id="soundIco"></span><span id="soundText">الصوت</span></button>
      <button id="fullBtn" type="button" class="tool" hidden><span class="ico" id="fullIco"></span><span id="fullText">ملء الشاشة</span></button>
      <div id="clock"></div>
    </div>
  </header>
  <main id="board">
    <h2 id="label">تفضّل استلم طلبك</h2>
    <div id="stage" hidden>
      <section id="latest"><small id="latestLabel">آخر طلب واجد</small><div id="latestNum"></div></section>
      <ul id="recent"></ul>
    </div>
    <p id="empty">جارٍ الاتصال…</p>
  </main>
  <div id="by">by <b>Bipilo</b></div>
  <p id="notice" hidden>تعذر تحديث الشاشة. نعيد الاتصال…</p>
  <button id="unlock" type="button" hidden>اضغط هنا (OK) باش تشغّل الصوت</button>
</div>
<script>
(function () {
  'use strict';
  var API = 'https://kdvtqlqiervznhzbpjcx.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_ZlS6hWKO4NHYSt0eJnh9gw_Oo0C8VJK';
  var POLL_MS = 3000, KEEP_MS = 10 * 60000, SHOW = 6, FLASH_MS = 10000;

  function $(id) { return document.getElementById(id); }
  function params() {
    var out = {}, query = window.location.search.replace(/^\?/, '').split('&');
    for (var i = 0; i < query.length; i++) {
      var pair = query[i].split('=');
      if (!pair[0]) continue;
      try { out[decodeURIComponent(pair[0])] = decodeURIComponent((pair[1] || '').replace(/\+/g, ' ')); } catch (e) {}
    }
    return out;
  }
  var q = params();
  var token = q.t || '';
  var pathCode = /^\/tv\/([A-Za-z0-9]{4,12})\/?$/.exec(window.location.pathname);
  var code = (pathCode ? pathCode[1] : q.c || '').toLowerCase();
  if (code) token = '';
  var langFixed = q.lang === 'fr' || q.lang === 'ar';
  var french = q.lang === 'fr';
  var WORDS = { fr: {
    sub: 'Écran d’appel', label: 'Votre commande est prête', latest: 'Dernière commande prête',
    empty: 'Aucun appel pour l’instant.', connecting: 'Connexion…', notice: 'Écran hors ligne. Reconnexion…',
    unlock: 'Appuyez ici (OK) pour activer le son', soundOn: 'Son activé', soundOff: 'Activer le son',
    full: 'Plein écran', exitFull: 'Quitter', repeat: 'Deux fois', missing: 'Lien de l’écran incomplet.',
    badCode: 'Code d’écran inconnu. Vérifiez-le dans Bipilo : Succursales et codes.'
  }, ar: {
    sub: 'شاشة النداء', label: 'تفضّل استلم طلبك', latest: 'آخر طلب واجد',
    empty: 'ما كاش نداء دروك.', connecting: 'جارٍ الاتصال…', notice: 'تعذر تحديث الشاشة. نعيد الاتصال…',
    unlock: 'اضغط هنا (OK) باش تشغّل الصوت', soundOn: 'الصوت شاعل', soundOff: 'شغّل الصوت',
    full: 'ملء الشاشة', exitFull: 'خروج', repeat: 'مرتين', missing: 'رابط الشاشة ناقص.',
    badCode: 'كود الشاشة غالط. شوفو في Bipilo: الفروع والأكواد.'
  } };
  var words = WORDS[french ? 'fr' : 'ar'];
  var emptyKey = token || code ? 'connecting' : 'missing';
  function setEmpty(key) { emptyKey = key; $('empty').firstChild.nodeValue = words[key]; }
  function applyLanguage() {
    document.documentElement.lang = french ? 'fr' : 'ar';
    document.documentElement.dir = french ? 'ltr' : 'rtl';
    $('sub').innerHTML = '';
    $('sub').appendChild(document.createTextNode(q.venueBranch || words.sub));
    $('label').firstChild.nodeValue = words.label;
    $('latestLabel').firstChild.nodeValue = words.latest;
    $('notice').firstChild.nodeValue = words.notice;
    $('unlock').firstChild.nodeValue = words.unlock;
    setEmpty(emptyKey);
    if (typeof showSound === 'function' && $('soundIco').innerHTML) showSound();
    if (typeof showFull === 'function' && $('fullIco').innerHTML) showFull();
    if (typeof showRepeat === 'function' && $('repeatIco').innerHTML) showRepeat();
  }
  // The branch's language from Bipilo («الفروع والأكواد»).
  function setLanguage(lang) {
    if (langFixed || (lang !== 'fr' && lang !== 'ar')) return;
    if ((lang === 'fr') === french) return;
    french = lang === 'fr';
    words = WORDS[lang];
    queue = [];
    applyLanguage();
  }
  applyLanguage();
  setName(q.venue || 'Bipilo');

  function setName(name) {
    name = String(name || 'Bipilo').slice(0, 100);
    $('name').innerHTML = '';
    $('name').appendChild(document.createTextNode(name));
    $('initial').innerHTML = '';
    $('initial').appendChild(document.createTextNode(name.charAt(0).toUpperCase()));
    document.title = name + ' | Bipilo';
  }

  // ---- clock -------------------------------------------------------------
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function tick() { var d = new Date(); $('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  tick(); setInterval(tick, 15000);

  // ---- server -------------------------------------------------------------
  function rpc(name, body, done) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', API + name, true);
    xhr.setRequestHeader('apikey', KEY);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Accept', 'application/json');
    xhr.timeout = 8000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { return done(e); }
        done(null, data);
      } else done(new Error('HTTP ' + xhr.status));
    };
    xhr.ontimeout = function () { done(new Error('timeout')); };
    xhr.send(JSON.stringify(body));
  }

  // ---- look: colour set + number style, from «الفروع والأكواد» -------------
  // Same values as src/screenThemes.js. Written as a style block (old TVs have
  // no CSS variables).
  var THEMES = {
    dark: { bg: '#101112', panel: '#17191b', latest: '#133a2b', fresh: '#1f6b3e', tile: '#1c2c22', accent: '#7ee2a8', digit: '#ffffff', tileDigit: '#b6f2cc', text: '#f3f6f4', muted: '#9aa59f' },
    green: { bg: '#0b2a24', panel: '#0f3a32', latest: '#145244', fresh: '#1f7a5c', tile: '#12473c', accent: '#9ff2c6', digit: '#ffffff', tileDigit: '#c9f7dd', text: '#eefaf3', muted: '#a6c9bb' },
    blue: { bg: '#0b1726', panel: '#102236', latest: '#15365a', fresh: '#1f5a96', tile: '#14304d', accent: '#8cc8ff', digit: '#ffffff', tileDigit: '#cfe6ff', text: '#eef5ff', muted: '#9fb4cc' },
    burgundy: { bg: '#1d0c10', panel: '#2a1217', latest: '#4a1621', fresh: '#7d2233', tile: '#3a1a20', accent: '#ffb3c0', digit: '#ffffff', tileDigit: '#ffd6dd', text: '#fff3f5', muted: '#c9a3aa' },
    coffee: { bg: '#1a130e', panel: '#241a13', latest: '#3d2a1c', fresh: '#6b4528', tile: '#33251a', accent: '#f3c98b', digit: '#fff7ea', tileDigit: '#f5dcb6', text: '#fbf3e8', muted: '#c4ad93' },
    light: { bg: '#eef1ec', panel: '#ffffff', latest: '#0c3e38', fresh: '#157a5c', tile: '#e3ede7', accent: '#0c3e38', digit: '#ffffff', tileDigit: '#0c3e38', text: '#13211e', muted: '#56665f' }
  };
  var digitsStyle = 'dots', themeName = '';
  function validPalette(p) {
    if (!p || typeof p !== 'object') return false;
    var keys = ['bg', 'panel', 'latest', 'fresh', 'tile', 'accent', 'digit', 'tileDigit', 'text', 'muted'];
    for (var i = 0; i < keys.length; i++) if (!/^#[0-9a-f]{6}$/i.test(p[keys[i]] || '')) return false;
    return true;
  }
  function applyTheme(name, palette) {
    var custom = name === 'custom' && validPalette(palette);
    var t = custom ? palette : THEMES[name] || THEMES.dark;
    var key = custom ? 'custom' + t.latest + t.bg + t.accent : THEMES[name] ? name : 'dark';
    if (key === themeName) return;
    themeName = key;
    var css =
      'html, body { background: ' + t.bg + '; color: ' + t.text + '; }' +
      '#sub, #empty, #by { color: ' + t.muted + '; }' +
      '#clock { color: ' + t.text + '; }' +
      '#board { background: ' + t.panel + '; }' +
      '#label { color: ' + t.accent + '; }' +
      '#latest { background: ' + t.latest + '; color: ' + t.digit + '; }' +
      '#latest small { color: ' + t.digit + '; }' +
      '#recent li { background: ' + t.tile + '; color: ' + t.tileDigit + '; }' +
      '#recent li.fresh { background: ' + t.fresh + '; color: ' + t.digit + '; }' +
      '.dot { background: ' + t.tileDigit + '; opacity: 0.13; }' +
      '.dot.on { opacity: 1; }' +
      '#latest .dot, #recent li.fresh .dot { background: ' + t.digit + '; }' +
      '#latest .dot { opacity: 0.16; } #latest .dot.on { opacity: 1; }' +
      '@-webkit-keyframes call { 50% { background: ' + t.fresh + '; } }' +
      '@keyframes call { 50% { background: ' + t.fresh + '; } }';
    var el = document.getElementById('themeCss');
    if (!el) {
      el = document.createElement('style');
      el.id = 'themeCss';
      document.getElementsByTagName('head')[0].appendChild(el);
    }
    if (el.styleSheet) el.styleSheet.cssText = css; else el.innerHTML = css;
    lastDrawn = '';
  }
  function applyDigits(style) {
    var next = style === 'bold' ? 'bold' : 'dots';
    if (next === digitsStyle) return;
    digitsStyle = next;
    lastDrawn = '';
  }

  // ---- dot-matrix numbers (5 × 7) ----------------------------------------
  var FONT = {
    '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'],
    '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
    '2': ['01110', '10001', '00001', '00010', '00100', '01000', '11111'],
    '3': ['11110', '00001', '00001', '01110', '00001', '00001', '11110'],
    '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'],
    '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
    '6': ['00110', '01000', '10000', '11110', '10001', '10001', '01110'],
    '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
    '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
    '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100']
  };
  function drawNumber(el, text, dot) {
    el.innerHTML = '';
    if (digitsStyle === 'bold') {
      var plain = document.createElement('span');
      plain.className = 'num boldnum';
      plain.style.fontSize = Math.round(dot * 9.6) + 'px';
      plain.appendChild(document.createTextNode(text));
      el.appendChild(plain);
      return;
    }
    var wrap = document.createElement('span');
    wrap.className = 'num';
    var gap = Math.max(1, Math.round(dot * 0.22));
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i), rows = FONT[ch];
      if (!rows) {
        var glyph = document.createElement('span');
        glyph.className = 'glyph';
        glyph.style.fontSize = dot * 7 + 'px';
        glyph.appendChild(document.createTextNode(ch));
        wrap.appendChild(glyph);
        continue;
      }
      var digit = document.createElement('span');
      digit.className = 'digit';
      digit.style.margin = '0 ' + dot + 'px';
      for (var r = 0; r < 7; r++) {
        var row = document.createElement('span');
        row.className = 'row';
        for (var c = 0; c < 5; c++) {
          var d = document.createElement('i');
          d.className = rows[r].charAt(c) === '1' ? 'dot on' : 'dot';
          d.style.width = dot + 'px';
          d.style.height = dot + 'px';
          d.style.margin = gap + 'px';
          row.appendChild(d);
        }
        digit.appendChild(row);
      }
      wrap.appendChild(digit);
    }
    el.appendChild(wrap);
  }

  // ---- what is on screen --------------------------------------------------
  var orders = null, previous = null, flash = {}, lastDrawn = '';
  function calledAt(o) { return Date.parse(o.ready_at || '') || 0; }
  function view(now) {
    var ready = [];
    for (var i = 0; i < (orders || []).length; i++) if (orders[i].status === 'ready') ready.push(orders[i]);
    ready.sort(function (a, b) { return calledAt(b) - calledAt(a); });
    var shown = [];
    for (var j = 0; j < ready.length && shown.length < SHOW; j++)
      if (!ready[j].ready_at || now - calledAt(ready[j]) <= KEEP_MS) shown.push(ready[j]);
    return shown;
  }
  function render() {
    var now = new Date().getTime();
    var shown = view(now);
    var sig = window.innerWidth + 'x' + window.innerHeight + '|';
    for (var i = 0; i < shown.length; i++) sig += shown[i].number + (flash[shown[i].number] > now ? '*' : '') + ',';
    if (orders === null) return;
    if (sig === lastDrawn) return;
    lastDrawn = sig;
    if (!shown.length) {
      $('stage').hidden = true;
      $('empty').hidden = false;
      setEmpty('empty');
      return;
    }
    $('empty').hidden = true;
    $('stage').hidden = false;
    var latest = shown[0], len = Math.max(2, String(latest.number).length);
    var big = Math.max(6, Math.floor(Math.min(window.innerHeight * 0.06, (window.innerWidth * 0.5) / (len * 7.6))));
    drawNumber($('latestNum'), String(latest.number), big);
    $('latest').className = flash[latest.number] > now ? 'fresh' : '';
    var list = $('recent');
    list.innerHTML = '';
    for (var k = 1; k < shown.length; k++) {
      var li = document.createElement('li');
      if (flash[shown[k].number] > now) li.className = 'fresh';
      var holder = document.createElement('div');
      drawNumber(holder, String(shown[k].number), Math.max(3, Math.floor(big * 0.28)));
      li.appendChild(holder);
      list.appendChild(li);
    }
  }

  // ---- sound: «الطلب رقم … جاهز» from clips, a beep when clips fail ------
  var Context = window.AudioContext || window.webkitAudioContext;
  var ctx = null, soundOn = false, clips = {}, queue = [], speaking = false;
  function startNode(node, at) { if (node.start) node.start(at); else node.noteOn(at); }
  function stopNode(node, at) { if (node.stop) node.stop(at); else node.noteOff(at); }
  function remember(on) { try { if (on) localStorage.setItem('bipilo-tv-sound', '1'); else localStorage.removeItem('bipilo-tv-sound'); } catch (e) {} }
  function recalled() { try { return localStorage.getItem('bipilo-tv-sound') === '1'; } catch (e) { return false; } }
  var muted = false;
  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
  var ICON_FULL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  function showSound() {
    $('soundIco').innerHTML = soundOn ? ICON_ON : ICON_OFF;
    $('soundText').innerHTML = '';
    $('soundText').appendChild(document.createTextNode(soundOn ? words.soundOn : words.soundOff));
    $('soundBtn').className = soundOn ? 'tool on' : 'tool';
  }
  function unlock() {
    muted = false;
    try { if (window.speechSynthesis) window.speechSynthesis.getVoices(); } catch (e) {}
    if (!Context) { soundOn = true; $('unlock').hidden = true; showSound(); return; }
    try {
      if (!ctx) ctx = new Context();
      if (ctx.resume) ctx.resume();
      var buffer = ctx.createBuffer(1, 1, 22050), source = ctx.createBufferSource();
      source.buffer = buffer; source.connect(ctx.destination); startNode(source, 0);
      soundOn = true; remember(true);
      $('unlock').hidden = true;
    } catch (e) {}
    showSound();
  }
  function askForSound() { $('unlock').hidden = false; try { $('unlock').focus(); } catch (e) {} }
  if (recalled() && Context) {
    try { ctx = new Context(); } catch (e) { ctx = null; }
    if (ctx && (!ctx.state || ctx.state === 'running')) soundOn = true; else askForSound();
  } else askForSound();
  $('unlock').onclick = unlock;
  // Any key or tap turns the sound on, unless someone switched it off on purpose.
  document.addEventListener('keydown', function () { if (!soundOn && !muted) unlock(); }, false);
  document.addEventListener('click', function () { if (!soundOn && !muted) unlock(); }, false);
  // «مرتين»: each call is said again 7 seconds later. Remembered on this TV.
  var ICON_REPEAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';
  var repeatOn = false;
  try { repeatOn = localStorage.getItem('bipilo-tv-repeat') === '1'; } catch (e) {}
  function showRepeat() {
    $('repeatIco').innerHTML = ICON_REPEAT;
    $('repeatText').innerHTML = '';
    $('repeatText').appendChild(document.createTextNode(words.repeat));
    $('repeatBtn').className = repeatOn ? 'tool on' : 'tool';
  }
  $('repeatBtn').onclick = function (event) {
    if (event && event.stopPropagation) event.stopPropagation();
    repeatOn = !repeatOn;
    try { if (repeatOn) localStorage.setItem('bipilo-tv-repeat', '1'); else localStorage.removeItem('bipilo-tv-repeat'); } catch (e) {}
    showRepeat();
  };
  showRepeat();
  $('soundBtn').onclick = function (event) {
    if (event && event.stopPropagation) event.stopPropagation();
    if (soundOn) {
      soundOn = false; muted = true; remember(false);
      queue = [];
      showSound();
    } else unlock();
  };
  showSound();

  // Fullscreen, when the TV browser offers it (many have it in their own menu instead).
  var root = document.documentElement;
  var enterFull = root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen ||
    root.mozRequestFullScreen || root.msRequestFullscreen;
  function fullElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement ||
      document.mozFullScreenElement || document.msFullscreenElement || null;
  }
  function showFull() {
    var on = Boolean(fullElement());
    $('fullIco').innerHTML = ICON_FULL;
    $('fullText').innerHTML = '';
    $('fullText').appendChild(document.createTextNode(on ? words.exitFull : words.full));
  }
  if (enterFull) {
    $('fullBtn').hidden = false;
    showFull();
    $('fullBtn').onclick = function (event) {
      if (event && event.stopPropagation) event.stopPropagation();
      try {
        if (fullElement()) {
          var leave = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen ||
            document.mozCancelFullScreen || document.msExitFullscreen;
          if (leave) leave.call(document);
        } else enterFull.call(root);
      } catch (e) {}
      if (!soundOn && !muted) unlock();
    };
    var events = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
    for (var ev = 0; ev < events.length; ev++) document.addEventListener(events[ev], showFull, false);
  }

  var UNITS = 20, TENS = 10;
  function numberClips(text) {
    text = String(text || '');
    if (!/^\d{1,8}$/.test(text)) return null;
    var n = Number(text);
    if (n === 0) return ['zero'];
    var parts = [], i;
    if (n > 9999) { for (i = 0; i < text.length; i++) parts.push(text.charAt(i) === '0' ? 'zero' : 'u' + text.charAt(i)); return parts; }
    function add(key) { parts.push(parts.length ? 'w' + key : key); }
    var th = Math.floor(n / 1000), hu = Math.floor((n % 1000) / 100), rest = n % 100;
    if (th) parts.push('k' + th);
    if (hu) add('h' + hu);
    if (rest) {
      if (rest < UNITS) add('u' + rest);
      else { if (rest % TENS) add('u' + (rest % TENS)); add('t' + Math.floor(rest / TENS)); }
    }
    return parts;
  }
  function loadClip(key, done) {
    if (clips[key]) return done(null, clips[key]);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/voice/ar/' + key + '.wav', true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function () {
      if (xhr.status !== 200) return done(new Error('clip'));
      try {
        ctx.decodeAudioData(xhr.response, function (buffer) { clips[key] = buffer; done(null, buffer); }, function () { done(new Error('decode')); });
      } catch (e) { done(e); }
    };
    xhr.onerror = function () { done(new Error('clip')); };
    xhr.send();
  }
  function beep(done) {
    try {
      var t = ctx.currentTime + 0.05;
      for (var i = 0; i < 2; i++) {
        var osc = ctx.createOscillator(), gain = ctx.createGain ? ctx.createGain() : ctx.createGainNode();
        osc.frequency.value = 880; gain.gain.value = 0.25;
        osc.connect(gain); gain.connect(ctx.destination);
        startNode(osc, t + i * 0.35); stopNode(osc, t + i * 0.35 + 0.22);
      }
    } catch (e) {}
    setTimeout(done, 900);
  }
  function speakFrench(number, done) {
    var synth = window.speechSynthesis, voice = null, voices, i;
    if (!synth || !window.SpeechSynthesisUtterance) return beep(done);
    voices = synth.getVoices() || [];
    for (i = 0; i < voices.length; i++) if (/^fr/i.test(voices[i].lang || '')) { voice = voices[i]; break; }
    if (!voice) return beep(done);
    beep(function () {
      var finished = false;
      function end() { if (!finished) { finished = true; done(); } }
      var u = new window.SpeechSynthesisUtterance('Commande numéro ' + number + ', votre commande est prête.');
      u.voice = voice; u.lang = voice.lang; u.rate = 0.92;
      u.onend = end; u.onerror = end;
      setTimeout(end, 9000);
      synth.speak(u);
    });
  }
  function sayOne(number, done) {
    if (french) return speakFrench(number, done);
    var keys = numberClips(number);
    if (!keys) return beep(done);
    keys = ['order'].concat(keys, ['ready']);
    var buffers = [], i = 0, failed = false;
    (function next() {
      if (failed) return;
      if (i === keys.length) return play();
      loadClip(keys[i], function (err, buffer) {
        if (err) { failed = true; return beep(done); }
        buffers.push(buffer); i++; next();
      });
    })();
    function play() {
      var at = ctx.currentTime + 0.05;
      for (var j = 0; j < buffers.length; j++) {
        if (keys[j] === 'ready') at += 0.16;
        var source = ctx.createBufferSource();
        source.buffer = buffers[j]; source.connect(ctx.destination); startNode(source, at);
        at += buffers[j].duration + (keys[j] === 'order' ? 0.14 : 0.03);
      }
      setTimeout(done, (at - ctx.currentTime) * 1000 + 300);
    }
  }
  function announce(numbers, again) {
    if (!soundOn || !ctx) return;
    for (var i = 0; i < numbers.length && i < 4; i++) queue.push(numbers[i]);
    if (!speaking) speakNext();
    if (repeatOn && !again) setTimeout(function () { announce(numbers, true); }, 7000);
  }
  function speakNext() {
    if (!queue.length) { speaking = false; return; }
    speaking = true;
    if (ctx.resume) ctx.resume();
    sayOne(queue.shift(), speakNext);
  }

  // ---- loop ---------------------------------------------------------------
  // number → when it was (last) called; a later time = staff called it again.
  function readyNumbers(list) {
    var set = {};
    for (var i = 0; i < list.length; i++)
      if (list[i].status === 'ready') set[list[i].number] = Date.parse(list[i].ready_at || '') || 1;
    return set;
  }
  function poll() {
    if (!token) return;
    rpc('display_orders', { ticket: token }, function (err, data) {
      if (err || !(data instanceof Array)) {
        $('notice').hidden = false;
      } else {
        $('notice').hidden = true;
        orders = data;
        var current = readyNumbers(data), called = [], now = new Date().getTime();
        if (previous)
          for (var n in current)
            if (current.hasOwnProperty(n) && (!previous[n] || current[n] > previous[n])) called.push(n);
        previous = current;
        for (var k = 0; k < called.length; k++) flash[called[k]] = now + FLASH_MS;
        if (called.length) announce(called);
        render();
      }
      setTimeout(poll, POLL_MS);
    });
  }
  function brand() {
    rpc('display_branding', { ticket: token }, function (err, data) {
      if (err || !data) return;
      if (!q.venue && data.name) setName(data.name);
      if (data.language) setLanguage(data.language);
      applyTheme(data.theme, data.palette);
      applyDigits(data.digits);
      render();
      if (typeof data.logo === 'string' && /^data:image\/(png|jpeg|webp);base64,/.test(data.logo)) {
        $('logo').src = data.logo; $('logo').hidden = false; $('initial').hidden = true;
      }
    });
  }
  // Short address bipilo.app/tv/k7m2x9 (or ?c=k7m2x9): the code gives the
  // screen token, checked again every 10 minutes in case the link was changed.
  function resolve(first) {
    rpc('display_code_token', { code: code }, function (err, data) {
      if (err) { if (first) $('notice').hidden = false; return setTimeout(function () { resolve(first); }, POLL_MS); }
      if (typeof data !== 'string' || !data) {
        token = '';
        orders = null; lastDrawn = '';
        $('stage').hidden = true; $('empty').hidden = false;
        setEmpty('badCode');
        $('unlock').hidden = true;
        return;
      }
      token = data;
      if (first) { brand(); poll(); }
    });
  }
  if (code) {
    resolve(true);
    setInterval(function () { resolve(false); }, 10 * 60000);
  } else if (token) {
    brand();
    poll();
  }
  setInterval(function () { if (token) brand(); }, 2 * 60000);
  applyTheme('dark');
  setInterval(render, 1000);
  window.onresize = function () { lastDrawn = ''; render(); };
})();
</script>
</body>
</html>
